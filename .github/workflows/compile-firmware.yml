name: Compile firmware

on:
  push:
    paths:
      - "firmware/**"
      - ".github/workflows/compile-firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/compile-firmware.yml"
  workflow_dispatch:

jobs:
  compile:
    name: ESP32-C3 sketches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32c3
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          libraries: |
            - name: GxEPD2
            - name: Adafruit GFX Library
            - name: Adafruit BusIO
          sketch-paths: |
            - firmware
          enable-deltas-report: false
          enable-warnings-report: false
